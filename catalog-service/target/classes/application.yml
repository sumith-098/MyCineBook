server:
  port: ${CATALOG_SERVICE_PORT}

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"
  application:
    name: catalog-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${CATALOG_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    # MUST be the exact same secret as auth-service — this service verifies tokens it did not issue.
    secret: ${JWT_SECRET}
    issuer: cinebook-auth-service
  # cors:
  #   allowed-origins: ${CORS_ALLOWED_ORIGINS}
  services:
    booking-service-url: ${BOOKING_SERVICE_URL}
  internal:
    api-key: ${INTERNAL_API_KEY}
  uploads:
    dir: ${UPLOADS_DIR}
    public-base-url: ${PUBLIC_BASE_URL}
    max-file-size-mb: 10

logging:
  level:
    com.cinebook.catalog: INFO



azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:movie-posters}
  cdn:
    domain: ${AZURE_CDN_DOMAIN}