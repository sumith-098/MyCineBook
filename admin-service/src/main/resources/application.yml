server:
  port: ${ADMIN_SERVICE_PORT}

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]"
  application:
    name: admin-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${ADMIN_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: cinebook-auth-service
  # cors:
  #   allowed-origins: ${CORS_ALLOWED_ORIGINS}
  services:
    auth-service-url: ${AUTH_SERVICE_URL}
    catalog-service-url: ${CATALOG_SERVICE_URL}
    booking-service-url: ${BOOKING_SERVICE_URL}
  commission:
    default-pct: 10.0

logging:
  level:
    com.cinebook.admin: INFO
